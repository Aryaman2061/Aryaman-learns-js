<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS ka tutorial</h1>
    <button id="stop">stop</button>
</body>
<script>
    console.log('going to change h1')
    const changeH1 = setTimeout(function(){
        document.querySelector('h1').innerHTML='Aryaman ka raj'
        // console.clear()
    },3000)
    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeH1)
        console.log('stopped')
    })

</script>
</html>

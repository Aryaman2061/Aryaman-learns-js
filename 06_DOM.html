    dayss.forEach( (div)=>{

    parenthaha.children[1].style.color="orange"

    // console.log("nodes: ",parenthaha.childNodes) //complex thingy


    // CREATE ELEMENT
    const div = document.createElement('div')
    // console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title", "generated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Chai aur code"
    // OR: adds the text instead of replacing all:
    const addText = document.createTextNode("Chai aur code")
    div.appendChild(addText) 
    //abhi tak yeh div sirf memory me hai, body me daalne ke liye:
    document.body.appendChild(div)

    function addLanguage(langName){
        const el = document.createElement('li')
        el.textContent=langName
        document.querySelector('.language').appendChild(el)
    }
    addLanguage('Python')
    addLanguage('Typescript')
    
    function addLanguageOptimised(langName){
        const el = document.createElement('li')
        el.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(el)
    }
    addLanguageOptimised('HTML')
    addLanguageOptimised('CSS')
    console.log(document.querySelector('.language'))


    // EDIT ELEMENT
    const secondLang = document.querySelector('li:nth-child(2)')
    // secondLang.innerHTML = 'C'
    const newli = document.createElement('li')
    newli.textContent ='C'
    secondLang.replaceWith(newli)

    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>MondoDB</li>'


    // REMOVE ELEMENT
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

</script>
